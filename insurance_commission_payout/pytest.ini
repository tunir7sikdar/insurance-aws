[pytest]
minversion = 7.0
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=glue/shared
    --cov=lambda
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
